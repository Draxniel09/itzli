[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "itzli"
version = "0.1.0"
description = "Desktop application for mobile repair in Linux"
authors = ["Daniel Mata Ruiz <draxniel575@gmail.com>"]
packages = [{include = "itzli"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
PySide6 = ">=6.11.0"
pyudev = "^0.24.0"
pyserial = "^3.5"
pyusb = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-qt = "^4.4.0"
black = "^24.0.0"
ruff = "^0.3.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*usb_descriptor_header.*:DeprecationWarning:usb.backend.libusb0",
    "ignore:.*usb_string_descriptor.*:DeprecationWarning:usb.backend.libusb0",
    "ignore:.*usb_device_descriptor.*:DeprecationWarning:usb.backend.libusb0",
    "ignore::DeprecationWarning:usb.backend.*"
]
