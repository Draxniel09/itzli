[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "openunlock-linux"
version = "0.1.0"
description = "Desktop application for mobile repair in Linux"
authors = ["Community <community@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
PySide6 = "^6.5.0"
pyudev = "^0.24.0"
pyserial = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-qt = "^4.4.0"
black = "^24.0.0"
ruff = "^0.3.0"
